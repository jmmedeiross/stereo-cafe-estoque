name: Qualidade
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: cp .dev.vars.example .dev.vars
      - run: npm run db:local
      - name: Integração HTTP local
        run: |
          npm run dev > /tmp/stereo-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -s http://127.0.0.1:5173/demo > /dev/null; then break; fi
            sleep 2
          done
          node tests/api.integration.mjs
